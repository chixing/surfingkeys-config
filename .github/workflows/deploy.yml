name: Deploy to Gist

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run type-check

      - run: npm run deploy
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
