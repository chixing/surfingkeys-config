name: Deploy to Gist

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-gist
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm ci

      - run: npm run lint

      - run: npm run type-check

      - run: npm run deploy
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
