name: Promote retained bundle to Gist

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Bundle release run to promote or restore
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-gist
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Verify successful source run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          read -r status conclusion workflow sha < <(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '[.status,.conclusion,.path,.head_sha] | @tsv')
          [[ "$status" == completed && "$conclusion" == success && "$workflow" == .github/workflows/bundle.yml ]] || exit 1
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          git merge-base --is-ancestor "$sha" origin/main
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: surfingkeys-bundle-${{ steps.source.outputs.sha }}
          path: release
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Promote the verified bytes
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
          EXPECTED_SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: node scripts/release.mjs deploy release
      - name: Record gist revision
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          revision=$(gh api gists/82767d49380294ad7b298554e2c0e59b --jq '.history[0].version')
          echo "Promoted source ${{ steps.source.outputs.sha }}; gist revision $revision" >> "$GITHUB_STEP_SUMMARY"
